name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: latest
          target: Win64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frame-perfect-buffer-win
          path: ${{ steps.build.outputs.build-output }}

      # Keeps a stable public download at .../releases/tag/latest so the
      # .geode file can be fetched without a GitHub login.
      - name: Publish "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          body: Automatic build of the latest commit on main.
          files: ${{ steps.build.outputs.build-output }}/*.geode
